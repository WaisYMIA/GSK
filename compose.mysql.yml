services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gsk_test
      MYSQL_USER: gsk_app
      MYSQL_PASSWORD: gsk_local_only_password
      MYSQL_ROOT_PASSWORD: gsk_root_local_only_password
    ports:
      - "127.0.0.1:3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - gsk_mysql_data:/var/lib/mysql
volumes:
  gsk_mysql_data:
